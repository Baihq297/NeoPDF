name: Build NeoPDF Windows x64 EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: legacy
            python: "3.8"
            requirements: requirements-legacy.txt
            exe: NeoPDF-Legacy-x64.exe
          - profile: modern
            python: "3.11"
            requirements: requirements-modern.txt
            exe: NeoPDF-x64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Extract NeoPDF source package
        shell: pwsh
        run: |
          $archive = "NeoPDF_Source_Upload.zip"
          if (Test-Path $archive) {
            Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP/neopdf-source" -Force
            $source = "$env:RUNNER_TEMP/neopdf-source/NeoPDF"
            Copy-Item "$source/*" "." -Recurse -Force
            if (Test-Path "$source/.github") {
              New-Item -ItemType Directory -Force ".github/workflows" | Out-Null
              Copy-Item "$source/.github/workflows/*" ".github/workflows/" -Force
            }
          }
          if (!(Test-Path "build_exe.py") -or !(Test-Path "main.py")) {
            throw "NeoPDF source files are missing. Ensure NeoPDF_Source_Upload.zip is present in the repository root."
          }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }}
      - name: Build standalone EXE
        run: python build_exe.py ${{ matrix.profile }}
      - name: Verify output
        shell: pwsh
        run: |
          $path = "dist/${{ matrix.profile }}/${{ matrix.exe }}"
          if (!(Test-Path $path)) { throw "EXE not found: $path" }
          Get-Item $path | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: NeoPDF-${{ matrix.profile }}-x64
          path: dist/${{ matrix.profile }}/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 30
